name: Build & Push Docker images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Frontend: Install & Build (only for frontend)
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - if: matrix.service == 'frontend'
        run: |
          cd job-craft-frontend
          npm ci
          npm run build

      - name: Backend: Build Jar (only for backend)
        if: matrix.service == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - if: matrix.service == 'backend'
        run: |
          cd job_craft_backend
          mvn -B -DskipTests package

      - name: Build and push image (frontend)
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v4
        with:
          context: ./job-craft-frontend
          file: ./job-craft-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:${{ github.sha }}

      - name: Build and push image (backend)
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v4
        with:
          context: ./job_craft_backend
          file: ./job_craft_backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ github.sha }}
